# CI MarkdownLister: build x86/x64 via build.ps1, pack release archive.
# On a v* tag: publish a GitHub Release with the archive and CHANGELOG notes.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build x86 and x64 (build.ps1)
        shell: powershell
        run: .\build.ps1

      - name: Pack release archive (pack.ps1)
        shell: powershell
        run: .\pack.ps1

      - name: Upload x86
        uses: actions/upload-artifact@v5
        with:
          name: MarkdownLister-x86
          path: dist/x86/

      - name: Upload x64
        uses: actions/upload-artifact@v5
        with:
          name: MarkdownLister-x64
          path: dist/x64/

      - name: Upload release archive
        uses: actions/upload-artifact@v5
        with:
          name: MarkdownLister-zip
          path: dist/MarkdownLister-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download release archive
        uses: actions/download-artifact@v5
        with:
          name: MarkdownLister-zip
          path: dist

      - name: Check tag matches Directory.Build.props
        shell: powershell
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = [string]$props.Project.PropertyGroup.Version
          $ver = $ver.Trim()
          $tag = '${{ github.ref_name }}'
          if ($tag -ne ('v' + $ver)) {
            throw "Tag $tag does not match version v$ver in Directory.Build.props"
          }

      - name: Extract release notes from CHANGELOG.md
        shell: powershell
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = $tag.Substring(1)
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^## \[' + [regex]::Escape($ver) + '\]')) {
              $start = $i + 1
              break
            }
          }
          if ($start -lt 0) { throw "Section for $ver not found in CHANGELOG.md" }
          $out = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { break }
            $out += $lines[$i]
          }
          Set-Content -Path notes.md -Value $out -Encoding utf8

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = (Get-Item dist\MarkdownLister-*.zip).FullName
          gh release create $tag $zip --title "MarkdownLister $tag" --notes-file notes.md
